<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>claude-devtools</title>
    <link rel="icon" type="image/png" href="codewiki-icon.png">
    <script>
        // Apply persisted theme before first paint to avoid a flash of the wrong theme
        (function() {
            try {
                var theme = localStorage.getItem('codewiki-theme');
                if (!theme) {
                    theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css" id="hljs-theme-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css" id="hljs-theme-dark" disabled>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11.9.0/dist/mermaid.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.0.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-gfm-heading-id@3.1.3/lib/index.umd.js"></script>
    <style>
        :root {
            --primary-color: #d95f00;
            --active-nav-bg: #0d2b50;
            --active-nav-text: #ffffff;
            --secondary-color: #f1f5f9;
            --text-color: #334155;
            --border-color: #e2e8f0;
            --hover-color: #f8fafc;
            --code-bg: #f8fafc;
            --page-bg: #ffffff;
            --panel-bg: #ffffff;
            --heading-color: #1e293b;
            --subheading-color: #475569;
            --body-color: #475569;
            --muted-color: #64748b;
            --inline-code-color: #e11d48;
            --error-bg: #fef2f2;
            --error-border: #fecaca;
            --error-color: #991b1b;
            --backdrop-color: rgba(15, 23, 42, 0.5);
            --lightbox-bg: rgba(255, 255, 255, 0.97);
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --primary-color: #ff9a2e;
            --active-nav-bg: #c45100;
            --active-nav-text: #ffffff;
            --secondary-color: #111827;
            --text-color: #cbd5e1;
            --border-color: #334155;
            --hover-color: #1e293b;
            --code-bg: #0d1117;
            --page-bg: #0f172a;
            --panel-bg: #1e293b;
            --heading-color: #f1f5f9;
            --subheading-color: #cbd5e1;
            --body-color: #94a3b8;
            --muted-color: #94a3b8;
            --inline-code-color: #f472b6;
            --error-bg: rgba(127, 29, 29, 0.25);
            --error-border: #7f1d1d;
            --error-color: #fca5a5;
            --backdrop-color: rgba(0, 0, 0, 0.6);
            --lightbox-bg: rgba(15, 23, 42, 0.97);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--page-bg);
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 320px;
            background-color: var(--secondary-color);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            position: fixed;
            height: 100vh;
            z-index: 200;
        }

        .content {
            flex: 1;
            margin-left: 320px;
            padding: 40px 60px;
            max-width: calc(100% - 320px);
        }

        .content-inner {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 220px;
            gap: 48px;
            align-items: start;
        }

        .content-inner.no-toc {
            grid-template-columns: minmax(0, 1fr);
        }

        .content-inner.no-toc .toc {
            display: none;
        }

        .doc-column {
            min-width: 0;
            max-width: 920px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .logo-mark {
            width: 34px;
            height: 34px;
            flex: 0 0 34px;
            object-fit: contain;
        }

        .logo-title {
            overflow: hidden;
            color: var(--heading-color);
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .theme-toggle {
            flex-shrink: 0;
            width: 34px;
            height: 34px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            font-size: 15px;
            line-height: 1;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--primary-color);
        }

        .repo-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: var(--panel-bg);
            color: var(--primary-color);
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .repo-link:hover {
            background: var(--hover-color);
            border-color: var(--primary-color);
        }

        .repo-info {
            margin: 0 0 20px 0;
            padding: 15px;
            background: var(--hover-color);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .repo-info h4 {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-row {
            font-size: 11px;
            color: var(--body-color);
            line-height: 1.6;
            margin-bottom: 4px;
        }

        .info-row strong {
            font-weight: 600;
            min-width: 80px;
            display: inline-block;
        }

        .nav-filter {
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            background: var(--panel-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        .nav-filter:focus {
            border-color: var(--primary-color);
        }

        .nav-filter::placeholder {
            color: var(--muted-color);
        }

        .nav-section {
            margin-bottom: 12px;
        }

        .nav-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            padding: 8px 12px;
        }

        .nav-item {
            display: block;
            padding: 10px 12px;
            color: var(--text-color);
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s ease;
            margin-bottom: 2px;
            cursor: pointer;
        }

        .nav-item:hover {
            background-color: var(--panel-bg);
            color: var(--primary-color);
        }

        .nav-item.active {
            background-color: var(--active-nav-bg);
            color: var(--active-nav-text);
        }

        .nav-item.nav-parent {
            font-weight: 600;
            font-size: 13px;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-item.nav-parent.active {
            color: var(--active-nav-text);
        }

        .nav-row {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .nav-row .nav-item {
            flex: 1;
            min-width: 0;
        }

        .nav-toggle {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            padding: 0;
            color: var(--muted-color);
            font-size: 11px;
            cursor: pointer;
            transition: transform 0.15s ease;
            transform: rotate(90deg);
        }

        .nav-group.collapsed > .nav-row .nav-toggle {
            transform: none;
        }

        .nav-group.collapsed > .nav-children {
            display: none;
        }

        .nav-children {
            margin-left: 14px;
        }

        .nav-children .nav-item {
            font-size: 13px;
            padding: 8px 12px;
        }

        .nav-children .nav-children .nav-item {
            font-size: 12px;
            padding: 6px 10px;
        }

        .nav-hidden {
            display: none !important;
        }

        #navigation.filtering .nav-group.filter-open > .nav-children {
            display: block;
        }

        .markdown-content {
            max-width: 100%;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3,
        .markdown-content h4,
        .markdown-content h5,
        .markdown-content h6 {
            scroll-margin-top: 1rem;
        }

        .markdown-content h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--heading-color);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .markdown-content h2 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-color);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .markdown-content h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--subheading-color);
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .markdown-content h4 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--subheading-color);
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .markdown-content p {
            margin-bottom: 1rem;
            color: var(--body-color);
        }

        .markdown-content ul, .markdown-content ol {
            margin-bottom: 1rem;
            padding-left: 2rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
            color: var(--body-color);
        }

        .markdown-content code {
            background-color: var(--code-bg);
            padding: 0.2em 0.4em;
            border-radius: 0.25rem;
            font-family: 'Fira Code', 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: var(--inline-code-color);
        }

        .code-block {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .markdown-content pre {
            background-color: var(--code-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .code-block pre {
            margin-bottom: 0;
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
            font-size: 0.875rem;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 4px 10px;
            font-size: 12px;
            font-family: inherit;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .code-block:hover .copy-btn,
        .copy-btn:focus {
            opacity: 1;
        }

        @media (hover: none) {
            .copy-btn {
                opacity: 1;
            }
        }

        .copy-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .copy-btn.copied {
            color: #16a34a;
            border-color: #16a34a;
            opacity: 1;
        }

        .markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--muted-color);
            background: var(--hover-color);
            padding: 1rem 1rem 1rem 1.5rem;
            border-radius: 0 0.5rem 0.5rem 0;
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .markdown-content th, .markdown-content td {
            border: 1px solid var(--border-color);
            padding: 0.75rem;
            text-align: left;
        }

        .markdown-content th {
            background-color: var(--secondary-color);
            font-weight: 600;
            color: var(--text-color);
        }

        .markdown-content tr:hover {
            background-color: var(--hover-color);
        }

        .markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .markdown-content a:hover {
            border-bottom-color: var(--primary-color);
        }

        .markdown-content img {
            max-width: 100%;
            height: auto;
            border-radius: 0.5rem;
            margin: 1rem 0;
        }

        .mermaid {
            position: relative;
            margin: 2rem 0;
            padding: 1.5rem;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            overflow-x: auto;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        .mermaid.zoomable svg {
            cursor: zoom-in;
        }

        .mermaid-expand {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            line-height: 1;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s ease, border-color 0.15s ease;
        }

        .mermaid:hover .mermaid-expand,
        .mermaid-expand:focus {
            opacity: 1;
        }

        @media (hover: none) {
            .mermaid-expand {
                opacity: 1;
            }
        }

        .mermaid-expand:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .mermaid-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 400;
            background: var(--lightbox-bg);
        }

        .mermaid-lightbox.open {
            display: block;
        }

        .lightbox-canvas {
            position: absolute;
            inset: 0;
            overflow: hidden;
            cursor: grab;
            touch-action: none;
        }

        .lightbox-canvas.dragging {
            cursor: grabbing;
        }

        .lightbox-stage {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
        }

        .lightbox-toolbar {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
            display: flex;
            gap: 8px;
        }

        .lightbox-toolbar button {
            min-width: 38px;
            height: 38px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-family: inherit;
            color: var(--text-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .lightbox-toolbar button:hover {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .lightbox-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            padding: 6px 14px;
            font-size: 12px;
            color: var(--muted-color);
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            pointer-events: none;
        }

        .mermaid-error {
            padding: 1rem;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 0.5rem;
            color: var(--error-color);
            font-size: 0.875rem;
        }

        .mermaid-error details {
            margin-top: 0.5rem;
        }

        .mermaid-error summary {
            cursor: pointer;
            font-weight: 500;
        }

        .mermaid-error pre {
            margin-top: 0.5rem;
            padding: 0.75rem;
            background: var(--code-bg);
            border-radius: 0.375rem;
            overflow-x: auto;
            color: var(--text-color);
            font-size: 0.8rem;
        }

        .toc {
            position: sticky;
            top: 40px;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
            font-size: 13px;
            padding-bottom: 20px;
        }

        .toc-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted-color);
            margin-bottom: 8px;
        }

        .toc-link {
            display: block;
            padding: 4px 0 4px 12px;
            color: var(--muted-color);
            text-decoration: none;
            border-left: 2px solid var(--border-color);
            line-height: 1.4;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toc-link.toc-h3 {
            padding-left: 24px;
        }

        .toc-link:hover {
            color: var(--primary-color);
        }

        .toc-link.active {
            color: var(--primary-color);
            border-left-color: var(--primary-color);
            font-weight: 500;
        }

        .pager {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            margin-top: 3rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .pager:empty {
            display: none;
        }

        .pager-link {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            text-decoration: none;
            max-width: 48%;
            transition: border-color 0.2s, background 0.2s;
        }

        .pager-link:hover {
            border-color: var(--primary-color);
            background: var(--hover-color);
        }

        .pager-next {
            margin-left: auto;
            text-align: right;
        }

        .pager-label {
            font-size: 12px;
            color: var(--muted-color);
        }

        .pager-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--primary-color);
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            color: var(--muted-color);
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid var(--secondary-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            padding: 2rem;
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            border-radius: 0.5rem;
            color: var(--error-color);
            margin: 2rem 0;
        }

        .error h3 {
            margin-bottom: 0.5rem;
        }

        .menu-toggle {
            display: none;
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 300;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--panel-bg);
            color: var(--text-color);
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--backdrop-color);
            z-index: 150;
        }

        .backdrop.visible {
            display: block;
        }

        @media (max-width: 1280px) {
            .content-inner {
                grid-template-columns: minmax(0, 1fr);
            }

            .toc {
                display: none;
            }
        }

        @media (max-width: 1024px) {
            .menu-toggle {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.25s ease;
                box-shadow: 0 0 24px rgba(0, 0, 0, 0.2);
            }

            .sidebar.open {
                transform: none;
            }

            .content {
                margin-left: 0;
                padding: 72px 20px 20px;
                max-width: 100%;
            }

            .markdown-content h1,
            .markdown-content h2,
            .markdown-content h3,
            .markdown-content h4,
            .markdown-content h5,
            .markdown-content h6 {
                scroll-margin-top: 64px;
            }
        }
    </style>
</head>
<body>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Toggle navigation">☰</button>
    <div class="backdrop" id="backdrop"></div>

    <div class="container">
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <img class="logo-mark" src="codewiki-icon.png" alt="CodeWiki">
                    <span class="logo-title">claude-devtools</span>
                </div>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
            </div>
            <a href="https://github.com/matt1398/claude-devtools" class="repo-link" target="_blank">🔗 View Repository</a>

            <div class="repo-info" id="repo-info" style="display: block;">

    "renderer_tabs_panes_navigation.md",
    "Session_Parsing_and_Analysis_Pipeline.md",

        // ---------- Hash routing ----------
        // URL scheme: #/<encodeURIComponent(filename)> or

        // slugs never contain ':', so splitting on the first ':' is unambiguous.

                const anchor = sep === -1 ? null : raw.slice(sep + 1);

        function scrollToAnchor(anchor) {

        // ---------- Sidebar navigation ----------

        function buildNavigation() {

            let html = '';

                html += buildNavItem(key, data, 0);

            nav.innerHTML = html;

            document.getElementById('sidebar').addEventListener('click', function(e) {

                if (toggle) {

                if (item) {

        function buildNavItem(key, data, depth) {
            const fileName = key + '.md';
            const hasChildren = data.children && Object.keys(data.children).length > 0;
            const hasComponents = data.components && data.components.length > 0;

            // Every module in the tree has a generated doc (parents get a
            // synthesized overview), so render a link whenever the node has
            // components or children. Only the synthetic fallback tree's bare
            // top-level node stays a plain header.
            let inner;
            if (depth === 0 && !hasChildren && !hasComponents) {

            } else {
                const parentClass = depth === 0 && hasChildren ? ' nav-parent' : '';
                inner = '<div class="nav-item' + parentClass + '" data-file="' + escapeHtml(fileName) + '">' +
                    escapeHtml(formatNavTitle(key)) + '</div>';

            if (!hasChildren) {

            let childrenHtml = '';
            for (const [childKey, childData] of Object.entries(data.children)) {

        function formatNavTitle(key) {

                .replace(/_/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))

        function setActiveNav(filename) {
            let active = null;
            document.querySelectorAll('.nav-item').forEach(item => {
                const isActive = item.getAttribute('data-file') === filename;
                item.classList.toggle('active', isActive);
                if (isActive) active = item;
            });

            // Reveal the active item by expanding its ancestor groups
            let group = active && active.closest('.nav-group');
            while (group) {
                group.classList.remove('collapsed');
                group = group.parentElement && group.parentElement.closest('.nav-group');
            }

        function setupNavFilter() {
            const input = document.getElementById('nav-filter');
            const nav = document.getElementById('navigation');

            input.addEventListener('input', function() {

                    const items = node.querySelectorAll('.nav-item');
                    let anyMatch = false;

        // ---------- Document loading & rendering ----------

        async function loadDocument(filename, anchor) {

            const content = document.getElementById('content');

        function setupLinkInterception() {

            // any other internal links.

        function safeDecode(text) {

                        .replace(/&amp;/g, '&')
                        .replace(/&quot;/g, '"')
                        .replace(/&#39;/g, "'");

        async function renderMermaidDiagrams() {

        // ---------- Mermaid full-screen lightbox with pan & zoom ----------

        function makeMermaidZoomable(element) {

        function ensureLightbox() {

                const factor = e.deltaY < 0 ? 1.15 : 1 / 1.15;

                if (pointers.size === 2) {

                    lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                }
            });

            canvas.addEventListener('pointermove', function(e) {
                if (!pointers.has(e.pointerId)) return;
                const prev = pointers.get(e.pointerId);
                pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (pointers.size === 1) {
                    lightboxState.tx += e.clientX - prev.x;
                    lightboxState.ty += e.clientY - prev.y;
                    applyLightboxTransform();
                } else if (pointers.size === 2) {
                    const pts = Array.from(pointers.values());
                    const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    if (lastPinchDist > 0) {
                        const rect = canvas.getBoundingClientRect();
                        const midX = (pts[0].x + pts[1].x) / 2 - rect.left;
                        const midY = (pts[0].y + pts[1].y) / 2 - rect.top;
                        zoomLightboxAt(midX, midY, dist / lastPinchDist);
                    }
                    lastPinchDist = dist;
                }
            });

            function releasePointer(e) {
                pointers.delete(e.pointerId);
                lastPinchDist = 0;
                if (pointers.size === 0) canvas.classList.remove('dragging');
            }
            canvas.addEventListener('pointerup', releasePointer);
            canvas.addEventListener('pointercancel', releasePointer);

            // Double-click to zoom in on a spot
            canvas.addEventListener('dblclick', function(e) {
                const rect = canvas.getBoundingClientRect();
                zoomLightboxAt(e.clientX - rect.left, e.clientY - rect.top, 2);
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightboxEl.classList.contains('open')) {
                    closeMermaidLightbox();
                }
            });

            return lightboxEl;
        }

        function openMermaidLightbox(element) {
            const svg = element.querySelector('svg');
            if (!svg) return;

            const lb = ensureLightbox();
            const stage = lb.querySelector('.lightbox-stage');
            stage.innerHTML = '';

            const clone = svg.cloneNode(true);
            let width = 800;
            let height = 600;
            const vb = clone.viewBox && clone.viewBox.baseVal;
            if (vb && vb.width && vb.height) {
                width = vb.width;
                height = vb.height;
            }
            // Give the clone its natural size; scaling happens via transform
            clone.style.maxWidth = 'none';
            clone.style.width = width + 'px';
            clone.style.height = height + 'px';
            clone.setAttribute('width', width);
            clone.setAttribute('height', height);
            stage.style.width = width + 'px';
            stage.style.height = height + 'px';
            stage.appendChild(clone);

            lightboxState.width = width;
            lightboxState.height = height;

            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
            fitLightbox();
        }

        function fitLightbox() {
            const canvas = lightboxEl.querySelector('.lightbox-canvas');
            const cw = canvas.clientWidth;
            const ch = canvas.clientHeight;
            // Fill most of the screen — small diagrams get scaled UP
            const fit = Math.min(cw * 0.9 / lightboxState.width, ch * 0.85 / lightboxState.height);
            lightboxState.scale = Math.min(Math.max(fit, 0.1), 10);
            lightboxState.tx = (cw - lightboxState.width * lightboxState.scale) / 2;
            lightboxState.ty = (ch - lightboxState.height * lightboxState.scale) / 2;
            applyLightboxTransform();
        }

        function zoomLightboxAt(x, y, factor) {
            const newScale = Math.min(Math.max(lightboxState.scale * factor, 0.1), 12);
            const applied = newScale / lightboxState.scale;
            lightboxState.tx = x - (x - lightboxState.tx) * applied;
            lightboxState.ty = y - (y - lightboxState.ty) * applied;
            lightboxState.scale = newScale;
            applyLightboxTransform();
        }

        function applyLightboxTransform() {
            const stage = lightboxEl.querySelector('.lightbox-stage');
            stage.style.transform = 'translate(' + lightboxState.tx + 'px, ' + lightboxState.ty + 'px) scale(' + lightboxState.scale + ')';
        }

        function closeMermaidLightbox() {
            if (!lightboxEl) return;
            lightboxEl.classList.remove('open');
            lightboxEl.querySelector('.lightbox-stage').innerHTML = '';
            document.body.style.overflow = '';
        }

        // ---------- On-page table of contents ----------

        function buildTOC() {
            const toc = document.getElementById('toc');
            const contentInner = document.querySelector('.content-inner');
            const headings = Array.from(document.querySelectorAll('#content h2, #content h3'))
                .filter(h => h.id);

            if (scrollSpyObserver) {
                scrollSpyObserver.disconnect();
                scrollSpyObserver = null;
            }

            if (headings.length < 3) {
                toc.innerHTML = '';
                contentInner.classList.add('no-toc');
                return;
            }

            contentInner.classList.remove('no-toc');
            let html = '<div class="toc-title">On this page</div>';
            headings.forEach(h => {
                html += '<a class="toc-link toc-' + h.tagName.toLowerCase() + '" href="#' +
                    escapeHtml(h.id) + '">' + escapeHtml(h.textContent) + '</a>';
            });
            toc.innerHTML = html;

            setupScrollSpy(headings);
        }

        function setupScrollSpy(headings) {
            scrollSpyObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    const id = entry.target.id;
                    document.querySelectorAll('.toc-link').forEach(a => {
                        a.classList.toggle('active', a.getAttribute('href') === '#' + id);
                    });
                });
            }, { rootMargin: '0px 0px -70% 0px' });

            headings.forEach(h => scrollSpyObserver.observe(h));
        }

        // ---------- Prev/next pager ----------

        function flattenModuleTree() {
            const order = ['overview.md'];

            function walk(tree, depth) {
                for (const [key, data] of Object.entries(tree)) {
                    const hasChildren = data.children && Object.keys(data.children).length > 0;
                    const hasComponents = data.components && data.components.length > 0;
                    // Mirror buildNavItem: skip bare headers without a doc
                    if (depth > 0 || hasChildren || hasComponents) {
                        order.push(key + '.md');
                    }
                    if (hasChildren) {
                        walk(data.children, depth + 1);
                    }
                }
            }

            if (MODULE_TREE) {
                walk(MODULE_TREE, 0);
            }
            return order;
        }

        const DOC_ORDER = flattenModuleTree();

        function pageTitleFor(filename) {
            const base = filename.replace(/\.md$/i, '');
            return base === 'overview' ? 'Overview' : formatNavTitle(base);
        }

        function renderPagerLinks(filename) {
            const pager = document.getElementById('pager');
            const idx = DOC_ORDER.indexOf(filename);

            if (idx === -1) {
                pager.innerHTML = '';
                return;
            }

            const prev = idx > 0 ? DOC_ORDER[idx - 1] : null;
            const next = idx < DOC_ORDER.length - 1 ? DOC_ORDER[idx + 1] : null;

            let html = '';
            if (prev) {
                html += '<a class="pager-link pager-prev" href="' + buildHash(prev) + '">' +
                    '<span class="pager-label">← Previous</span>' +
                    '<span class="pager-title">' + escapeHtml(pageTitleFor(prev)) + '</span></a>';
            }
            if (next) {
                html += '<a class="pager-link pager-next" href="' + buildHash(next) + '">' +
                    '<span class="pager-label">Next →</span>' +
                    '<span class="pager-title">' + escapeHtml(pageTitleFor(next)) + '</span></a>';
            }
            pager.innerHTML = html;
        }

        // ---------- Theme ----------

        function setupThemeToggle() {
            syncThemeAssets();

            document.getElementById('theme-toggle').addEventListener('click', async function() {
                const dark = !isDarkTheme();
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
                try {
                    localStorage.setItem('codewiki-theme', dark ? 'dark' : 'light');
                } catch (e) {
                    // Storage unavailable (private mode etc.) — theme just won't persist
                }

                syncThemeAssets();
                initMermaid();
                closeMermaidLightbox();

                // Re-render diagrams from their stored source in the new theme
                document.querySelectorAll('#content .mermaid').forEach(el => {
                    if (el.dataset.src) el.innerHTML = '';
                });
                await renderMermaidDiagrams();
            });
        }

        function syncThemeAssets() {
            const dark = isDarkTheme();
            document.getElementById('theme-toggle').textContent = dark ? '☀️' : '🌙';

            const lightCss = document.getElementById('hljs-theme-light');
            const darkCss = document.getElementById('hljs-theme-dark');
            if (lightCss) lightCss.disabled = dark;
            if (darkCss) darkCss.disabled = !dark;
        }

        // ---------- Mobile drawer ----------

        function setupMobileDrawer() {
            document.getElementById('menu-toggle').addEventListener('click', function() {
                const sidebar = document.getElementById('sidebar');
                sidebar.classList.toggle('open');
                document.getElementById('backdrop').classList.toggle('visible', sidebar.classList.contains('open'));
            });

            document.getElementById('backdrop').addEventListener('click', closeDrawer);
        }

        function closeDrawer() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('backdrop').classList.remove('visible');
        }

        // ---------- Utilities ----------

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showError(message) {
            const loading = document.getElementById('loading');
            const content = document.getElementById('content');

            loading.style.display = 'none';
            content.style.display = 'block';
            content.innerHTML = '<div class="error"><h3>⚠️ Error</h3><p>' +
                escapeHtml(message) + '</p></div>';
            document.getElementById('pager').innerHTML = '';
            document.getElementById('toc').innerHTML = '';
            document.querySelector('.content-inner').classList.add('no-toc');
        }
    </script>
</body>
</html>
